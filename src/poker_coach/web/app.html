<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poker-coach</title>
<style>
  :root {
    --bg: #14161a;      --panel: #1b1e24;    --panel-2: #21252c;
    --line: #2c313a;    --text: #e6e8ec;     --dim: #8b93a1;
    --hero: #6ea8fe;    --good: #5fb87a;     --warn: #d8a657;    --bad: #e06c75;
    --red: #e06c75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 320px 1fr; height: 100vh;
  }
  /* ---- list pane ---- */
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  #filters { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .filt {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); cursor: pointer; padding: 4px 12px; font: inherit; font-size: 11px;
    font-weight: 650;
  }
  .filt:hover { color: var(--text); }
  .filt.on { color: var(--text); border-color: var(--dim); background: var(--panel-2); }
  .filt.bad.on  { color: var(--bad);  border-color: rgba(224,108,117,.5); background: rgba(224,108,117,.12); }
  .filt.warn.on { color: var(--warn); border-color: rgba(216,166,87,.5);  background: rgba(216,166,87,.12); }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1; background: none; border: 0; color: var(--dim); cursor: pointer;
    padding: 14px 0; font: inherit; font-size: 12px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--hero); }

  /* range grid */
  .rangegrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; max-width: 640px; }
  .rc {
    aspect-ratio: 1; border-radius: 3px; font-size: 10px; font-weight: 650;
    display: flex; align-items: center; justify-content: center;
    color: #14161a; background: #e9eaee; position: relative; overflow: hidden;
  }
  .rc.pair { outline: 1px solid var(--text); outline-offset: -1px; }
  /* The square the verdict was about. Ring plus a pulse, because on a 169-cell
     grid a static outline is easy to miss. */
  .rc.hit {
    outline: 3px solid var(--hero); outline-offset: 1px; z-index: 2;
    animation: pulse 1.1s ease-out 3;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(110,168,254,0); }
    50%      { box-shadow: 0 0 0 6px rgba(110,168,254,.45); }
  }
  .rc i { position: absolute; inset: 0 auto 0 0; }
  .rc span { position: relative; }
  .legend { display: flex; gap: 14px; margin: 14px 0 4px; font-size: 12px; align-items: center; }
  .legend b { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  textarea.notes {
    width: 100%; min-height: 240px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical;
  }
  .saverow { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .btn {
    background: var(--hero); color: #0d1117; border: 0; border-radius: 6px;
    padding: 8px 16px; font: inherit; font-weight: 650; cursor: pointer;
  }
  .saved { color: var(--good); font-size: 12px; }
  .row {
    padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center;
  }
  /* Labels get their own column so the eye can scan straight down them. Under
     the hand they moved with the card count and were easy to miss entirely. */
  .row.hand { grid-template-columns: 58px auto minmax(0, 1fr) auto; }
  /* The time leads the row because the list is chronological -- it is the axis
     you scan down. Position moved into the meta line, where it still reads as
     the hero colour but no longer claims a column of its own. */
  .row .when {
    color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row .meta .pos { color: var(--hero); font-weight: 700; }
  /* The labels column takes the slack, so labels sit against the hand rather
     than drifting right and reading as a second net column. */
  .row .flags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .row:hover { background: var(--panel-2); }
  .row.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--hero); }
  .row .pos { font-weight: 700; color: var(--hero); font-size: 12px; }
  .row .meta { color: var(--dim); font-size: 12px; }
  .row .net { font-variant-numeric: tabular-nums; font-size: 12px; }
  .row .flag {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 650; color: var(--bad); white-space: nowrap;
    background: rgba(224,108,117,.12); border: 1px solid rgba(224,108,117,.35);
  }
  /* Interest is a nudge to look, not a criticism -- it must not read as an error. */
  .row .flag.note {
    color: var(--dim); background: var(--panel-2); border-color: var(--line);
  }
  /* A priceable node is neither good nor bad news -- it says the cost of this
     decision is knowable, not that it was a mistake. Green would read as praise. */
  .row .flag.exact, .act .exact {
    color: var(--hero); background: rgba(110,168,254,.10);
    border-color: rgba(110,168,254,.35);
  }
  .act .exact {
    display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px solid;
    font-size: 10px; font-weight: 650; white-space: nowrap; margin-left: 8px;
  }
  /* Sits under the sizing, inside the same cell, so the row keeps its columns. */
  .priced {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px;
    font-size: 11px; color: var(--dim);
  }
  .priced b { color: var(--text); font-weight: 650; }
  .priced .pos-net b { color: var(--good); }
  .priced .neg-net b { color: var(--bad); }
  .priced .hindsight { display: contents; }
  /* A fact whose arithmetic is one hover away. Drawn here rather than left to
     the browser's `title`: that waits about a second, renders at caption size,
     and wraps a sentence badly -- and when it silently does not appear there is
     nothing to inspect. This shows immediately and is a real element. */
  .hint { position: relative; cursor: help; }
  .hint b { text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
  .hint::after {
    content: attr(data-tip);
    position: absolute; left: 0; top: calc(100% + 6px); z-index: 40;
    width: max-content; max-width: 330px;
    background: #0f1115; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: normal; text-transform: none; letter-spacing: 0;
    box-shadow: 0 12px 30px rgba(0,0,0,.55);
    opacity: 0; visibility: hidden; transition: opacity .12s ease;
    pointer-events: none;
  }
  .hint:hover::after { opacity: 1; visibility: visible; }
  .priced .work {
    flex-basis: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; opacity: .75;
  }
  .pos-net { color: var(--good); } .neg-net { color: var(--bad); } .zero-net { color: var(--dim); }
  .group {
    padding: 12px 16px 6px; font-size: 10px; font-weight: 700; color: var(--dim);
    text-transform: uppercase; letter-spacing: .1em; background: var(--bg);
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
  }
  #reftoggle {
    margin: 14px 16px 24px; padding: 9px 12px; text-align: center; cursor: pointer;
    border: 1px dashed var(--line); border-radius: 6px; color: var(--dim); font-size: 12px;
  }
  #reftoggle:hover { color: var(--text); border-color: var(--dim); }
  #more { padding: 12px 16px; color: var(--dim); cursor: pointer; text-align: center; font-size: 12px; }
  #more:hover { color: var(--text); }

  /* ---- detail pane ---- */
  #detail { overflow-y: auto; padding: 24px 28px 60px; }
  .empty { color: var(--dim); margin-top: 20vh; text-align: center; }
  h2 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
  .sub { color: var(--dim); margin-bottom: 22px; font-size: 13px; }
  .pagehead { display: flex; align-items: flex-start; gap: 16px; }
  .pagehead > div { flex: 1; min-width: 0; }
  .srcbtn {
    flex: none; margin-top: 2px; padding: 4px 11px; border-radius: 999px;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    font: 600 11px/1.4 inherit; cursor: pointer;
  }
  .srcbtn:hover { color: var(--text); border-color: #3a4150; }
  .srcbtn.on { color: var(--text); background: var(--panel-2); }
  /* The site's own text: monospace and pre-wrapped because ACR's alignment is
     load-bearing, and capped in height so a long hand does not push the action
     off the screen you opened it to compare against. */
  .src {
    margin: 0 0 22px; padding: 12px 14px; max-height: 40vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .cards { display: inline-flex; gap: 4px; vertical-align: middle; }
  .card {
    display: inline-block; min-width: 28px; text-align: center; padding: 2px 5px;
    background: #f4f4f6; color: #14161a; border-radius: 4px;
    font: 600 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* The pip carries the suit; nudged up slightly so rank and symbol sit on the
     same optical line, and never allowed emoji presentation. */
  .card i { font-style: normal; font-size: 12px; margin-left: 1px; font-variant-emoji: text; }
  /* Four-colour deck: spades black, hearts red, diamonds blue, clubs green.
     Suit is carried by colour alone here, so the letter stays visible too. */
  .card.s { color: #14161a; }
  .card.h { color: #c0392b; }
  .card.d { color: #1f66c4; }
  .card.c { color: #1b7a3e; }
  .card.back { background: var(--panel-2); color: var(--dim); }

  .street { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .street > header {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .street .name {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--dim); font-weight: 700; min-width: 62px;
  }
  .street .pot { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .act {
    display: grid; grid-template-columns: 52px 64px 92px 1fr; gap: 10px;
    padding: 6px 14px; border-top: 1px solid #23262d; align-items: baseline;
  }
  /* Fixed cards column, not auto: a face-down single card is narrower than two
     face-up ones, and an auto column would step the action verbs in and out
     row by row. */
  .act .cards { min-width: 60px; }
  /* The outcome tally is three cells, not four: no action verb, and its cards
     column has to hold "did not show". */
  .act.tally { grid-template-columns: 52px 104px 1fr; }
  .rake { color: var(--dim); font-size: 11px; font-weight: 600; margin-left: 6px; }
  .act .peek { cursor: pointer; }
  .act .peek:hover .card.back { color: var(--text); background: #2b2f38; }
  .act:first-of-type { border-top: 0; }
  .act.hero { background: rgba(110,168,254,.07); }
  details.act { display: block; padding: 0; }
  details.act > summary {
    display: grid; grid-template-columns: 52px 64px 92px 1fr auto auto; gap: 10px;
    align-items: baseline; padding: 6px 14px; cursor: pointer; list-style: none;
  }
  details.act > summary::-webkit-details-marker { display: none; }
  details.act > summary:hover { background: rgba(110,168,254,.06); }
  .chev { color: var(--dim); transition: transform .15s; font-size: 15px; }
  details[open] .chev { transform: rotate(90deg); display: inline-block; }
  .decbody { padding: 4px 14px 14px; border-top: 1px dashed var(--line); }
  .decbody .facts { margin-top: 10px; }
  .act .who { color: var(--dim); font-weight: 650; font-size: 12px; }
  .act.hero .who { color: var(--hero); }
  /* Same colours the chart grid gives these actions (ACTION_COLOUR), so a verb
     in the action list and a cell in a range mean the same thing at a glance.
     Aggression is bold and red, continuing is green; the passive actions are
     unbolded because a check or a fold is rarely the thing to look at first. */
  .act .what { font-weight: 600; }
  .act .what.bet, .act .what.raise { color: var(--bad); }
  .act .what.call { color: var(--good); }
  /* Check is not a colour of its own: it is the passive default, and giving it
     the hero blue made every check look like it was hero's. */
  .act .what.check { color: var(--text); font-weight: 400; }
  .act .what.fold { color: var(--dim); font-weight: 400; }
  .act .size { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
  .allin { color: var(--warn); font-weight: 700; font-size: 11px; letter-spacing: .05em; }

  .dec { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; background: var(--panel); }
  .dec .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .dec .st { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .dec .action { font-weight: 650; font-size: 15px; }
  .verdict {
    text-decoration: none; white-space: nowrap; border-radius: 999px;
    padding: 3px 11px; font-size: 11px; font-weight: 650; border: 1px solid;
  }
  .verdict em { font-style: normal; opacity: .65; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .verdict.good { color: var(--good); border-color: rgba(95,184,122,.4); background: rgba(95,184,122,.10); }
  .verdict.ok   { color: var(--warn); border-color: rgba(216,166,87,.4);  background: rgba(216,166,87,.10); }
  .verdict.bad  { color: var(--bad);  border-color: rgba(224,108,117,.4); background: rgba(224,108,117,.12); }
  .verdict:hover { filter: brightness(1.25); }
  [hidden] { display: none !important; }

  /* Chart modal. A verdict is checked mid-read, so following it should not cost
     the hand you were looking at -- the old link navigated away and coming back
     meant the browser's back button. */
  #overlay {
    position: fixed; inset: 0; z-index: 50; padding: 6vh 20px;
    background: rgba(9,11,14,.74); display: flex; justify-content: center;
    align-items: flex-start; overflow: auto;
  }
  #overlay .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    width: 100%; max-width: 700px; padding: 16px 20px 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  #overlay header {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px;
  }
  #overlay h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 650; }
  #overlay h2 small { display: block; color: var(--dim); font-size: 12px; font-weight: 400; }
  .sheetclose {
    flex: none; background: none; border: 0; color: var(--dim); cursor: pointer;
    font-size: 22px; line-height: 1; padding: 0 4px;
  }
  .sheetclose:hover { color: var(--text); }
  #overlay .notesread {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px; white-space: pre-wrap;
  }
  #overlay .full { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--hero); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fact {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font-size: 12px;
  }
  .fact b { color: var(--dim); font-weight: 600; margin-right: 5px; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
  .fact span { font-variant-numeric: tabular-nums; }

  .gto { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 11px; }
  .gto .label { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); font-weight: 700; margin-bottom: 8px; }
  .freq { display: grid; grid-template-columns: 60px 1fr 46px; gap: 9px; align-items: center; margin-bottom: 5px; font-size: 13px; }
  .freq .bar { height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .freq .bar i { display: block; height: 100%; background: var(--hero); }
  .freq .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .freq.taken .n { color: var(--good); font-weight: 650; }
  .mixed { color: var(--warn); font-size: 11px; margin-top: 7px; }
  .none { color: var(--dim); font-size: 12px; font-style: italic; }
  .dimnote { color: var(--dim); }
  .result { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 24px 0 10px; }

  /* Below ~900px the fixed sidebar leaves too little for the detail pane: board
     cards clip and bet sizings vanish off the right edge. Stack instead. */
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; height: 100vh; }
    #list { border-right: 0; border-bottom: 1px solid var(--line); }
    #detail { padding: 18px 16px 48px; }
    /* Let the action rows reflow rather than hold three rigid columns. */
    .act { grid-template-columns: 46px 60px 76px 1fr; gap: 8px; padding: 6px 12px; }
    .street > header { flex-wrap: wrap; gap: 8px; }
    .freq { grid-template-columns: 52px 1fr 40px; }
  }
</style>
</head>
<body>
  <div id="list">
    <div id="tabs"><button class="tab on" data-tab="hands">Hands</button><button class="tab" data-tab="charts">Charts</button></div>
    <div id="filters"><button class="filt on" data-f="all">All</button><button class="filt bad" data-f="flagged">Preflop</button><button class="filt warn" data-f="interesting">Interesting</button><button class="filt" data-f="terminal">Terminal</button></div>
    <div id="rows"></div><div id="more">load more</div>
  </div>
  <div id="detail"><div class="empty">Select a hand</div></div>

<div id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
    <header><h2 id="sheettitle"></h2><button class="sheetclose" title="Close (Esc)">&times;</button></header>
    <div id="sheetbody"></div>
  </div>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
let offset = 0, total = 0, active = null;
// What the left list currently holds. loadList() appends rather than replaces
// (it paginates), so anything that switches modes has to clear first -- browser
// Back out of a chart used to leave the chart rows sitting there.
let listMode = null;
// "To review" shows only hands with an off-chart preflop action. Filtering is
// server-side and applied before pagination -- filtering the loaded page would
// report a count that is not the archive's.
let filterKind = "all";
// 9-handed-only charts are reference material for a game you don't play.
let showRef = false;

// U+FE0E forces text presentation. Without it the heart and diamond flip to
// emoji on macOS and render in the font's own fixed colours, which throws away
// the four-colour deck.
const SUIT = { s: "\u2660\uFE0E", h: "\u2665\uFE0E", d: "\u2666\uFE0E", c: "\u2663\uFE0E" };
const cardEls = (cs) => cs.map(c =>
  `<span class="card ${c[1]}">${c[0]}<i>${SUIT[c[1]] || c[1]}</i></span>`).join("");
const faces = (cs) => `<span class="cards">${cardEls(cs)}</span>`;
const BACK = `<span class="card back">??</span>`;

// Two different absences, and they must not render the same way.
// hole(): null means the cards exist but were never shown -> face-down.
const hole = (cs) => cs && cs.length ? faces(cs) : `<span class="cards">${BACK}</span>`;
// board(): empty means no cards are out yet (preflop) -> show nothing. A
// face-down card here would imply a hidden board that does not exist.
const board = (cs) => cs && cs.length ? faces(cs) : "";

const bb = (n) => n === null || n === undefined ? "" : `${n}bb`;
// Rake is genuinely a money figure -- the whole point of it is what it costs --
// so it reads in dollars while everything else stays in big blinds.
const money = (cents) => `$${(cents / 100).toFixed(2)}`;
const netClass = (n) => n > 0 ? "pos-net" : n < 0 ? "neg-net" : "zero-net";
// The source text is the site's, not ours, and it contains other players'
// screen names -- the one string on the page that must not be trusted as HTML.
const esc = (s) => s.replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

// Local time, not the site's UTC. What matters is when you were at the table,
// and one evening's session straddles two UTC dates.
const when = (iso) => new Date(iso);
const dayKey = (d) => d.toDateString();
const dayLabel = (d) => d.toLocaleDateString(undefined,
  { weekday: "long", month: "short", day: "numeric" });
const clock = (d) => d.toLocaleTimeString(undefined,
  { hour: "numeric", minute: "2-digit" });
// Carried across pages: "load more" appends, so the header must not repeat for
// a day already open above.
let lastDay = null;

async function loadList() {
  if (listMode !== "hands") {
    $("#rows").innerHTML = ""; offset = 0; listMode = "hands"; lastDay = null;
  }
  $("#filters").style.display = "flex";
  // The server groups by *local* day, so it needs the offset: this archive is
  // one UTC day that reads locally as two sessions.
  const tz = -new Date().getTimezoneOffset();
  const r = await fetch(
      `/api/hands?offset=${offset}&limit=60&filter=${filterKind}&tz=${tz}`)
    .then(r => r.json());
  const LABEL = { flagged: "Preflop", interesting: "Interesting", terminal: "Terminal" };
  for (const [k, n] of Object.entries(r.counts || {})) {
    const b = $(`.filt[data-f="${k}"]`);
    if (b) b.textContent = `${LABEL[k]} (${n})`;
  }
  if (filterKind !== "all" && !r.rows.length && !offset) {
    $("#rows").innerHTML = `<div class="row"><div></div><div class="meta">Nothing matches.</div><div></div></div>`;
  }
  total = r.total;
  for (const row of r.rows) {
    // A day heading rather than a date on every row: the list is chronological,
    // so the date only changes a couple of times, and 320px of sidebar has no
    // room to repeat it 58 times.
    if (row.played_at) {
      const d = when(row.played_at);
      if (dayKey(d) !== lastDay) {
        lastDay = dayKey(d);
        const head = document.createElement("div");
        head.className = "group";
        head.textContent = dayLabel(d);
        $("#rows").appendChild(head);
      }
    }
    const el = document.createElement("div");
    el.className = "row hand";
    el.dataset.file = row.file;
    if (row.error) {
      el.innerHTML = `<div class="pos">!</div><div class="meta">${row.file}</div><div></div><div></div>`;
    } else {
      const off = row.preflop_off_chart || [];
      el.innerHTML = `
        <div class="when">${row.played_at ? clock(when(row.played_at)) : ""}</div>
        <div>${hole(row.hole_cards)}
          <div class="meta"><b class="pos">${row.position}</b> · ${
            row.hero_street_reached}</div></div>
        <div class="flags">
          ${(row.terminal || []).length ? `<div class="flag exact" title="${
            row.terminal_hero ? "Your decision" : "A villain's decision"
            } (${row.terminal.join(", ")}) where calling ends the hand, so its cost is computable without a solver"
            >${row.terminal_hero ? "" : "villain "}call ends it</div>` : ""}${
            off.length ? `<div class="flag" title="${off.join(" · ")}">${
            off.length > 1 ? `${off.length} preflop` : "preflop"}</div>` : ""}${
            (row.interest || []).length ? `<div class="flag note" title="${
              row.interest.join(" · ")}">${row.interest[0]}</div>` : ""}</div>
        <div class="net ${netClass(row.hero_net_bb)}">${row.hero_net_bb > 0 ? "+" : ""}${row.hero_net_bb}</div>`;
    }
    el.onclick = () => open(row.file, el);
    $("#rows").appendChild(el);
  }
  offset += r.rows.length;
  $("#more").style.display = offset >= total ? "none" : "block";
}

async function open(file, el) {
  if (active) active.classList.remove("active");
  if (el) { active = el; el.classList.add("active"); }
  // A hand gets its own URL, so a spot worth revisiting can be bookmarked or
  // sent to someone rather than hunted for in the list again.
  if (location.hash.slice(1) !== file) history.replaceState(null, "", "#" + file);
  render(await fetch(`/api/hands/${file}`).then(r => r.json()));
}

function actionSize(a) {
  if (a.action === "bet" || a.action === "raise") {
    return `to ${bb(a.to_bb)}` + (a.pct_pot ? ` · ${a.pct_pot}% pot` : "");
  }
  return a.action === "call" ? bb(a.amount_bb) : "";
}

// Hero's rows carry their own analysis, collapsed. Reading a hand means
// following the action; a separate decisions list repeated the whole sequence
// and made you match rows by eye. The verdict label stays visible collapsed --
// that is the part you scan for.
// Whose cards to show on an action row. Hero's are always face-up -- they are
// what the decision was made with. A villain still in the hand shows a card
// back: reviewing a spot means judging it from what hero could see, so a row
// that gave their holding away for free would be answering the question it is
// supposed to ask. Where they did show at the end, the back is a button.
// A folder gets nothing -- they are out, and their cards are never knowable.
function actorCards(a) {
  // Hero's fold still shows: what was folded is the decision being reviewed.
  if (a.is_hero) return hole(a.cards);
  if (a.action === "fold") return `<span class="cards"></span>`;
  if (!a.cards) return `<span class="cards">${BACK}</span>`;
  return `<span class="cards peek" data-seat="${a.seat}" data-cards="${
    a.cards.join(",")}" title="Shown at showdown — click to reveal">${BACK}</span>`;
}

// The whole point of marking a terminal node is that its price is knowable, so
// the row shows the price and the arithmetic that produced it. Hindsight, and
// labelled as such: the equity is against the hand they actually turned over,
// which answers what the call was worth and not whether it was right.
function priced(a) {
  const p = a.price;
  if (!p) return "";
  const pot = p.pot_bb, call = p.call_bb, eq = p.equity;
  const verb = a.action === "call" ? "calling" : "calling would have been";
  const sum = `${eq.toFixed(3)} × (${pot} + ${call}) − ${call} = ${p.ev > 0 ? "+" : ""}${p.ev}bb`;
  // "needed" is a fact of the pot -- price and stake, nothing about anyone's
  // cards -- so it always shows. Everything after it is equity against the hand
  // they actually turned over, which is both hindsight and a card reveal, so it
  // waits for the same click their cards do.
  const gate = p.villain_is_hero ? "" : ` data-peeked="${p.villain_seat}" hidden`;
  return `<div class="priced">
    <span>needed <b>${(p.needed * 100).toFixed(0)}%</b></span>
    <span class="hindsight"${gate}>
      <span>had <b>${(p.equity * 100).toFixed(0)}%</b> vs ${p.villain.join("")}</span>
      <span class="${netClass(p.ev)}">${verb} <b>${p.ev > 0 ? "+" : ""}${p.ev}bb</b></span>
      <span class="work">${sum} · ${p.exact
        ? `all ${p.runouts.toLocaleString()} runout${p.runouts === 1 ? "" : "s"}`
        : `${p.runouts.toLocaleString()} sampled runouts, so ±½ point`}</span>
    </span>
  </div>`;
}

function renderAction(a, d) {
  // Marked on the row rather than only in a summary: the point of the label is
  // to say which decision in the hand is the one with a knowable price.
  // Only where the cards are known: without them there is nothing to price,
  // and the label would promise a number that cannot be worked out.
  const exact = a.terminal && a.cards
    ? ` <span class="exact" title="${a.terminal === "river"
        ? "Last street, heads up: a call goes straight to showdown."
        : "Nobody left has chips behind: a call runs it out."
      } No betting follows, so what calling and folding were worth can be worked out exactly — no solver needed.">call ends it</span>`
    : "";
  // A villain's verdict names their hand -- it links to the square and says the
  // class in its tooltip -- so it stays hidden until their cards are turned
  // over. Otherwise the face-down cards are decoration and the row gives away
  // the thing you are supposed to be judging without.
  const villain = !a.is_hero && a.verdict
    ? " " + verdictLink(a.verdict, `data-peeked="${a.seat}" hidden`) : "";
  const size = `${actionSize(a)}${a.is_all_in ? ' <span class="allin">ALL-IN</span>' : ""}${exact}${villain}${priced(a)}`;
  const head = `<span class="who">${a.position}</span>
      ${actorCards(a)}
      <span class="what ${a.action}">${a.action}</span>
      <span class="size">${size}</span>`;
  if (!a.is_hero || !d) {
    return `<div class="act${a.is_hero ? " hero" : ""}">${head}</div>`;
  }
  return `<details class="act hero">
    <summary>${head}${renderVerdict(d)}<span class="chev">›</span></summary>
    <div class="decbody">
      <div class="facts">${decisionFacts(d)}</div>
      ${renderGto(d)}
      ${renderAnalysis(d)}
    </div>
  </details>`;
}

function decisionFacts(d) {
  // [label, value, working] -- a fact with working is clickable and shows it.
  const f = [];
  if (d.pot_odds !== null) {
    f.push(["pot odds", `${(d.pot_odds * 100).toFixed(1)}%`, d.pot_odds_working]);
  }
  if (d.to_call_bb) f.push(["to call", bb(d.to_call_bb)]);
  // The pot on the table. Where part of it is more than hero can cover, the
  // contestable figure is the one the odds used, so show both rather than
  // leaving the arithmetic looking like it used the wrong number.
  f.push(["pot", d.pot_effective_bb < d.pot_before_bb
    ? `${bb(d.pot_before_bb)} · ${bb(d.pot_effective_bb)} contestable`
    : bb(d.pot_before_bb)]);
  if (d.spr !== null) f.push(["SPR", d.spr]);
  if (d.stack_before_bb !== null) f.push(["stack", bb(d.stack_before_bb)]);
  if (d.facing) {
    f.push(["facing", `${d.facing.position} ${d.facing.action} to ${bb(d.facing.to_bb)}${
      d.facing.all_in ? " all-in" : ""}`]);
  }
  return f.map(([k, v, work]) => work
    ? `<div class="fact hint" data-tip="${esc(work)}"><b>${k}</b><span>${v}</span></div>`
    : `<div class="fact"><b>${k}</b><span>${v}</span></div>`).join("");
}

function renderAnalysis(d) {
  return `<div class="gto"><div class="label">Analysis</div>${
    d.analysis ? d.analysis.comment : `<div class="none">Not analyzed yet.</div>`}</div>`;
}

function renderGto(d) {
  if (!d.gto) {
    return `<div class="gto"><div class="label">Equilibrium</div>
      <div class="none">Not looked up — no chart for this spot.</div></div>`;
  }
  const rows = d.gto.actions.map(a => {
    const taken = a.action === d.hero_action;
    return `<div class="freq${taken ? " taken" : ""}">
      <div class="n">${a.action}</div>
      <div class="bar"><i style="width:${(a.frequency * 100).toFixed(0)}%"></i></div>
      <div class="pct">${(a.frequency * 100).toFixed(0)}%</div></div>`;
  }).join("");
  // A genuinely mixed node means deviating is not a mistake. Saying so is the
  // difference between a tool a player trusts and one they stop believing.
  const mixed = d.gto.mixed
    ? `<div class="mixed">Mixed strategy — more than one action is correct here.</div>` : "";
  return `<div class="gto"><div class="label">Equilibrium · ${d.gto.source || d.gto.provider}</div>
    ${rows}${mixed}</div>`;
}

// The chart is a link, not a citation: a verdict you cannot check is worth
// less than no verdict. Inside a <summary>, a click would also toggle the row.
function verdictLink(v, extra = "") {
  return `<a class="verdict ${v.tone}" onclick="return openChartModal(this, event)" ${extra}
    href="#chart:${v.chart}:${v.hand}"
    title="${v.hand} in ${v.chart.replace(/_/g," ")}">${v.label}
    <em>${(v.frequency * 100).toFixed(0)}%</em></a>`;
}

function renderVerdict(d) {
  return d.verdict ? verdictLink(d.verdict) : "";
}

function renderOutcome(v) {
  const sd = v.showdown;
  if (!sd || !sd.players.length) return "";
  const rakeC = v.result.rake_cents || 0;
  const bbC = v.hand.stakes.bb_cents;
  // Winning the pot and finishing ahead are different things, and the label is
  // for the first. Chopped pots are the case that separates them: after rake
  // both winners are usually down, so a row can read "-0.2bb CHOP" and be
  // exactly right. Saying CHOP rather than WON is what stops that looking wrong.
  const label = (p) => p.won
    ? ` <span class="allin">${sd.chopped ? "CHOP" : "WON"}</span>` : "";
  // Rake once, on the first winning row -- it came out of the pot they were
  // paid from, however many of them there were. The percentage is of the
  // pre-rake payout (everything collected, plus the rake), which is what would
  // have been paid out had the house not dropped.
  const paid = sd.players.reduce((n, p) => n + (p.collected_cents || 0), 0);
  let raked = false;
  const rakeTag = (p) => {
    if (!p.won || raked) return "";
    raked = true;
    if (!rakeC) return ' <span class="rake dimnote">no rake</span>';
    // Fall back to this winner's own pre-rake net when the site did not record
    // who collected -- right whenever the pot was not chopped.
    const gross = paid ? paid + rakeC : p.net_cents + rakeC;
    const pct = gross > 0 ? ` · ${(100 * rakeC / gross).toFixed(1)}%` : "";
    return ` <span class="rake" title="${money(rakeC)} — ${
      pct ? "share of the pre-rake payout" : "pre-rake payout unknown"}">rake ${
      (rakeC / bbC).toFixed(2)}bb${pct}</span>`;
  };
  const rows = sd.players
    // Winners first, then by net. Sorting on net alone buries a chopped winner
    // below a player who folded a blind and lost less than they did.
    .slice().sort((a, b) => (b.won - a.won) || (b.net_cents - a.net_cents))
    .map(p => `<div class="act tally${p.is_hero ? " hero" : ""}">
        <div class="who">${p.position}</div>
        <div>${p.cards ? faces(p.cards) : '<span class="none">did not show</span>'}</div>
        <div class="size ${netClass(p.net_bb)}">${p.net_bb > 0 ? "+" : ""}${p.net_bb}bb${
          label(p)}${rakeTag(p)}</div>
      </div>`).join("");
  return `<h3>Outcome</h3>
    <div class="street"><header>
        <span class="name">${sd.went_to_showdown ? "showdown" : "no showdown"}</span>
        ${board(sd.board)}</header>${rows}</div>`;
}

function render(v) {
  if (v.error) { $("#detail").innerHTML = `<div class="empty">${v.error}</div>`; return; }
  const h = v.hand;
  const byIndex = new Map(v.hero_decisions.map(d => [d.action_index, d]));
  // Everything else on this page is derived; this is what the site actually
  // said. Behind a button because it is the thing you reach for when a number
  // looks wrong, not something to read on the way past.
  const src = h.source_text
    ? `<button class="srcbtn" type="button">source</button>` : "";
  $("#detail").innerHTML = `
    <div class="pagehead">
      <div>
        <h2>${h.hero.position} &nbsp;${hole(h.hero.hole_cards)}</h2>
        <div class="sub">${h.site}/${h.site_hand_id} · ${h.stakes.label} · ${h.table.players_dealt}-handed ·
          ${h.hero.eff_stack_bb}bb effective</div>
      </div>${src}
    </div>
    ${h.source_text ? `<pre class="src" hidden>${esc(h.source_text)}</pre>` : ""}
    <h3>Action</h3>
    ${v.streets.map(s => `<div class="street"><header>
        <span class="name">${s.street}</span>
        <span class="pot">${bb(s.pot_start_bb)}</span>
        ${board(s.board)}</header>
      ${s.actions.map(a => renderAction(a, byIndex.get(a.action_index))).join("")}</div>`).join("")}
    ${renderOutcome(v)}`;
  $("#detail").scrollTop = 0;
}

const ACTION_COLOUR = { raise: "#e06c75", bet: "#e06c75", call: "#5fb87a",
                        check: "#6ea8fe", mixed: "#d8a657", fold: "#e9eaee" };
const RANKS13 = "AKQJT98765432".split("");

async function loadCharts() {
  const r = await fetch("/api/charts").then(r => r.json());
  listMode = "charts";
  $("#filters").style.display = "none";
  $("#rows").innerHTML = "";
  $("#more").style.display = "none";
  if (!r.spots.length) {
    $("#rows").innerHTML = `<div class="row"><div class="meta">No charts imported.</div></div>`;
    return;
  }
  // Grouped by the seat making the decision, in table order -- that is how you
  // look a chart up at the table, and 68 flat rows are unnavigable.
  const ORDER = ["UTG", "HJ", "CO", "BTN", "SB", "BB"];
  const groups = new Map();
  for (const spot of r.spots) {
    const ref = spot.startsWith("9max_");
    const seat = spot.replace(/^9max_/, "").split("_")[0];
    const key = ref ? `9-handed only · ${seat}` : seat;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(spot);
  }
  const rank = (k) => k.startsWith("9-handed")
    ? 100 + ORDER.indexOf(k.split("· ")[1])
    : ORDER.indexOf(k);
  // The 9-handed-only charts are two thirds of the pack and no 6-max hand can
  // ever match one, so they are collapsed by default rather than burying the
  // 34 that are actually usable.
  const refCount = r.spots.filter(x => x.startsWith("9max_")).length;
  for (const key of [...groups.keys()].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))) {
    if (key.startsWith("9-handed") && !showRef) continue;
    const head = document.createElement("div");
    head.className = "group";
    head.textContent = key;
    $("#rows").appendChild(head);
    for (const spot of groups.get(key).sort()) {
      const el = document.createElement("div");
      el.className = "row"; el.dataset.spot = spot;
      const rest = spot.replace(/^9max_/, "").split("_").slice(1, -1)
        .join(" ").replace("preflop ", "");
      el.innerHTML = `<div class="pos">${spot.replace(/^9max_/, "").split("_")[0]}</div>
        <div><div class="meta">${rest}</div></div><div></div>`;
      el.onclick = () => openChart(spot, el);
      $("#rows").appendChild(el);
    }
  }
  if (refCount) {
    const t = document.createElement("div");
    t.id = "reftoggle";
    t.textContent = showRef
      ? `Hide 9-handed-only charts`
      : `Show ${refCount} 9-handed-only charts`;
    t.onclick = () => { showRef = !showRef; loadCharts(); };
    $("#rows").appendChild(t);
  }
}

// The 13x13 grid, built once and used by both the chart page and the modal --
// two copies would drift, and the mixed-strategy banding is the part worth
// keeping identical.
function rangeGrid(c, highlight) {
  const seen = new Set();
  const cellHtml = (hand) => {
    const mix = c.grid[hand] || { fold: 1 };
    Object.keys(mix).forEach(a => seen.add(a));
    // Mixed strategies are drawn as proportional bands, not a single winner
    // colour -- flattening them would hide that more than one action is correct.
    let x = 0;
    const bands = Object.entries(mix).sort((a, b) => b[1] - a[1]).map(([a, f]) => {
      const w = f * 100, style = `left:${x}%;width:${w}%;background:${ACTION_COLOUR[a] || "#888"}`;
      x += w; return `<i style="${style}"></i>`;
    }).join("");
    const hit = hand === highlight ? " hit" : "";
    return `<div class="rc${hand.length === 2 ? " pair" : ""}${hit}" data-hand="${hand}">${bands}<span>${hand}</span></div>`;
  };
  const cellsHtml = RANKS13.flatMap((hi, i) =>
    RANKS13.map((lo, j) => cellHtml(i === j ? hi + lo : (j > i ? hi + lo + "s" : lo + hi + "o")))
  ).join("");
  return `<div class="rangegrid">${cellsHtml}</div>
    <div class="legend">${[...seen].map(a =>
      `<span><b style="background:${ACTION_COLOUR[a] || "#888"}"></b>${a}</span>`).join("")}</div>`;
}

async function openChart(spot, el, highlight) {
  if (active) active.classList.remove("active");
  if (el) { active = el; el.classList.add("active"); }
  history.replaceState(null, "", "#chart:" + spot + (highlight ? ":" + highlight : ""));
  const c = await fetch(`/api/charts/${encodeURIComponent(spot)}`).then(r => r.json());
  const ref = spot.startsWith("9max_");
  const bare = spot.replace(/^9max_/, "");
  $("#detail").innerHTML = `
    <h2>${bare.split("_")[0]} <span class="sub" style="font-size:14px">${
      bare.replace(/_/g, " ")}</span>${
      ref ? ' <span class="verdict ok" style="margin-left:8px">9-handed only</span>' : ""}</h2>
    <h3>Range</h3>
    ${rangeGrid(c, highlight)}
    <h3>Notes</h3>
    <textarea class="notes" id="notes">${c.notes.replace(/</g,"&lt;")}</textarea>
    <div class="saverow"><button class="btn" id="save">Save notes</button><span class="saved" id="savedmsg"></span></div>`;
  $("#save").onclick = async () => {
    await fetch(`/api/charts/${encodeURIComponent(spot)}/notes`, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ notes: $("#notes").value }),
    });
    $("#savedmsg").textContent = "saved";
    setTimeout(() => { $("#savedmsg").textContent = ""; }, 1800);
  };
  $("#detail").scrollTop = 0;
  if (highlight) {
    const cell = $(`.rc[data-hand="${CSS.escape(highlight)}"]`);
    if (cell) cell.scrollIntoView({ block: "center" });
  }
}

function setTab(name) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab === name));
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    setTab(t.dataset.tab);
    active = null;
    $("#detail").innerHTML = `<div class="empty">Select a ${t.dataset.tab === "hands" ? "hand" : "chart"}</div>`;
    history.replaceState(null, "", "#");
    if (t.dataset.tab === "charts") loadCharts();
    else loadList();
  };
});

document.querySelectorAll(".filt").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".filt").forEach(x => x.classList.toggle("on", x === b));
    filterKind = b.dataset.f;
    listMode = null;          // force the list to rebuild from the top
    loadList();
  };
});

$("#more").onclick = loadList;

// One router for both entry points. The verdict badges link to #chart:..., and
// clicking one only changes the hash -- so routing has to run on `hashchange`
// too, not just at load. Handling it once at startup meant in-app links updated
// the URL and did nothing.
async function route() {
  const want = decodeURIComponent(location.hash.slice(1));

  if (want.startsWith("chart:")) {
    // #chart:SPOT or #chart:SPOT:HAND -- spot keys never contain a colon.
    const [, spot, hand] = want.split(":");
    setTab("charts");
    // Rebuild only when the list isn't already in chart mode, so following a
    // link between charts doesn't flash or lose scroll position.
    if (listMode !== "charts") await loadCharts();
    // A 9-handed-only chart is hidden behind the toggle; a link straight to one
    // has to reveal it or it lands on a chart with no row to highlight.
    if (spot.startsWith("9max_") && !showRef) { showRef = true; await loadCharts(); }
    const row = $(`.row[data-spot="${CSS.escape(spot)}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
    await openChart(spot, row, hand);
    return;
  }

  setTab("hands");
  if (listMode !== "hands") await loadList();
  if (want) {
    const row = $(`.row[data-file="${CSS.escape(want)}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
    await open(want, row);
  } else {
    if (active) active.classList.remove("active");
    active = null;
    $("#detail").innerHTML = `<div class="empty">Select a hand</div>`;
  }
}

// Turning a villain's cards over. Delegated, because action rows are rebuilt
// on every hand. Every row for that seat flips together -- revealing one and
// leaving the others face-down would read as two different players.
// stopPropagation because the click can land inside a hero <details> summary,
// which would otherwise collapse the decision out from under the reveal.
$("#detail").addEventListener("click", (e) => {
  const btn = e.target.closest(".srcbtn");
  if (btn) {
    const pre = $(".src");
    pre.hidden = !pre.hidden;
    btn.classList.toggle("on", !pre.hidden);
    return;
  }
  const hit = e.target.closest(".peek");
  if (!hit) return;
  e.preventDefault();
  e.stopPropagation();
  const shown = hit.dataset.shown === "1";
  const seat = Number(hit.dataset.seat);
  for (const el of document.querySelectorAll(`.peek[data-seat="${seat}"]`)) {
    el.dataset.shown = shown ? "" : "1";
    el.innerHTML = shown ? BACK : cardEls(el.dataset.cards.split(","));
  }
  // Anything that would name the hand travels with the cards.
  for (const el of document.querySelectorAll(`[data-peeked="${seat}"]`)) {
    el.hidden = shown;
  }
});

// ---- chart modal ----
// A verdict link is consulted in the middle of reading a hand, so following it
// should not replace the hand. The href stays real -- middle-click, copy-link
// and the Charts tab all still work -- and the click is intercepted.
let lastFocus = null;

async function showChart(spot, highlight) {
  const c = await fetch(`/api/charts/${encodeURIComponent(spot)}`).then(r => r.json());
  const bare = spot.replace(/^9max_/, "");
  $("#sheettitle").innerHTML = `${bare.split("_")[0]}${
    highlight ? ` &middot; ${highlight}` : ""}<small>${bare.replace(/_/g, " ")}${
    spot.startsWith("9max_") ? " — 9-handed only" : ""}</small>`;
  $("#sheetbody").innerHTML = rangeGrid(c, highlight)
    + (c.notes ? `<div class="notesread">${esc(c.notes)}</div>` : "")
    + `<a class="full" href="#chart:${spot}${highlight ? ":" + highlight : ""}">
         Open the full chart to edit notes →</a>`;
  lastFocus = document.activeElement;
  $("#overlay").hidden = false;
  $(".sheetclose").focus();
}

function closeChart() {
  $("#overlay").hidden = true;
  $("#sheetbody").innerHTML = "";
  if (lastFocus) lastFocus.focus();
}

// Bound on the link itself rather than delegated. The anchor already needed an
// inline handler to keep the click off the <details> summary it sits inside, and
// one handler that certainly runs beats a document-level listener whose phase
// has to be reasoned about against the summary's own stopPropagation.
function openChartModal(link, event) {
  event.preventDefault();
  event.stopPropagation();
  const [, spot, hand] = link.getAttribute("href").split(":");
  showChart(spot, hand);
  return false;
}

document.addEventListener("click", (e) => {
  // The backdrop, but not the sheet itself.
  if (e.target.id === "overlay" || e.target.closest(".sheetclose")) closeChart();
});

// Esc is the whole point of the modal: out without touching history.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#overlay").hidden) closeChart();
});

// The "open the full chart" link inside the sheet does navigate, so get out of
// the way first or the modal hangs over the page it just opened.
$("#overlay").addEventListener("click", (e) => {
  if (e.target.closest("a.full")) closeChart();
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
