[project]
name = "poker-coach"
version = "0.1.0"
description = "Post-session poker study tool: hand histories in, mistakes ranked by $EV lost out"
requires-python = ">=3.11"
dependencies = [
    # Pinned to a minor range on purpose. replay.py depends on three behaviors
    # pokerkit does not document -- state_actions being off by one, the State
    # object being mutated in place, and street_index ordering -- and a 0.x
    # library is entitled to change all of them. Widen only with tests green.
    "pokerkit>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
